name: RAG Evaluation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true  # pull corpus.json from Git LFS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --upgrade openai

      - name: Cache chroma DB
        id: cache-chroma
        uses: actions/cache@v4
        with:
          path: data/chroma_db
          key: chroma-v1-${{ hashFiles('data/corpus.json') }}

      - name: Embed corpus into Chroma
        if: steps.cache-chroma.outputs.cache-hit != 'true'
        run: python ingestion/embed_corpus.py

      - name: Run RAGAs evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: openai
          TOKENIZERS_PARALLELISM: "false"
        run: pytest eval/evaluate.py -v --tb=short

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: .pytest_cache/