name: RAG Evaluation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache corpus and chroma DB
        id: cache-data
        uses: actions/cache@v4
        with:
          path: |
            data/corpus.json
            data/chroma_db
          key: rag-data-v1-${{ hashFiles('ingestion/ingest_arxiv.py', 'ingestion/embed_corpus.py') }}

      - name: Build corpus (download + chunk)
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: python ingestion/ingest_arxiv.py

      - name: Embed corpus into Chroma
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: python ingestion/embed_corpus.py

      - name: Run RAGAs evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: openai
          TOKENIZERS_PARALLELISM: "false"
        run: pytest eval/evaluate.py -v --tb=short

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: .pytest_cache/